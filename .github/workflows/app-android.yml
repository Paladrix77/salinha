name: App Android (APK)

on:
  push:
    branches: [dev, main]
    paths: ["app/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # As máquinas do GitHub já vêm com o Android SDK (ANDROID_HOME)
      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Instalar Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Oficial (main) abre a Salinha oficial; teste (dev) abre a de testes
        if: github.ref_name == 'main'
        working-directory: app
        run: node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.server.url='https://salinha.p4ladino777.workers.dev';fs.writeFileSync(f,JSON.stringify(c,null,2));console.log(c.server.url)"

      - name: Criar projeto Android
        working-directory: app
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#5865f2' --splashBackgroundColor '#16171b' || echo "ícones: usando os padrão"
          node preparar-android.mjs
          npx cap sync android
          if [ "${{ github.ref_name }}" != "main" ]; then
            # App de teste separado do oficial (dá pra ter os dois instalados)
            sed -i 's/applicationId "com.salinha.app"/applicationId "com.salinha.app.teste"/' android/app/build.gradle
            sed -i 's#<string name="app_name">Salinha</string>#<string name="app_name">Salinha Teste</string>#; s#<string name="title_activity_main">Salinha</string>#<string name="title_activity_main">Salinha Teste</string>#' android/app/src/main/res/values/strings.xml
          fi
          grep applicationId android/app/build.gradle
          grep app_name android/app/src/main/res/values/strings.xml

      - name: Mesma assinatura em todo APK (atualiza sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp app/nativo/salinha-debug.keystore ~/.android/debug.keystore

      - name: Gerar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Salinha-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Salinha-${{ github.ref_name }}-apk
          path: Salinha-${{ github.ref_name }}.apk

      - name: Publicar pra baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.ref_name }}-${{ github.run_number }}
          name: "Salinha ${{ github.ref_name == 'main' && 'oficial' || 'teste' }} — versão ${{ github.run_number }}"
          body: "Baixe o arquivo .apk abaixo pelo celular e instale. (Gerado automaticamente.)"
          files: Salinha-${{ github.ref_name }}.apk
          make_latest: ${{ github.ref_name == 'main' }}

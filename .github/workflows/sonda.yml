name: Sonda futebol
on:
  push:
    branches: [sonda-futebol]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          D0=$(date -u +%Y%m%d); D1=$(date -u -d '-4 days' +%Y%m%d); D2=$(date -u -d '+5 days' +%Y%m%d)
          B="https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1/scoreboard"
          for U in "$B?dates=$D1-$D2" "$B?dates=$D1" "$B?dates=$D0&lang=pt&region=br" "$B?lang=pt&region=br"; do
            echo "== $U"; curl -s --compressed -o o.txt -w "http=%{http_code} bytes=%{size_download}\n" "$U"; head -c 200 o.txt; echo; jq -c '[.events | length, (.day.date // null)]' o.txt 2>/dev/null
          done
          curl -s --compressed "$B?lang=pt&region=br" > s.json
          echo "== eventos"; jq -c '.events[] | {id, date, st: .status.type.state, det: .status.type.shortDetail, d2: .status.type.detail, clk: .status.displayClock, c: [.competitions[0].competitors[] | {h: .homeAway, s: .score, n: .team.displayName, sn: .team.shortDisplayName, a: .team.abbreviation}]}' s.json | head -24
          echo "== completo"; jq -c '([.events[] | select(.status.type.state!="pre")][0] // .events[0]) | {status, comp: (.competitions[0] | {details, venue: .venue.fullName, competitors: [.competitors[] | {id, homeAway, score, winner, team: (.team | {id, displayName, shortDisplayName, abbreviation, logo})}]})}' s.json | cut -c1-3000
          echo "== tabela"; curl -s --compressed "https://site.api.espn.com/apis/v2/sports/soccer/bra.1/standings?lang=pt&region=br" > t.json
          jq -c '[(.children | length), (.children[0].standings.entries | length)]' t.json
          jq -c '.children[0].standings.entries[0:2][] | {team: (.team | {id, displayName, shortDisplayName, abbreviation, logo: .logos[0].href}), note: .note, stats: [.stats[] | {n: .name, v: .value, d: .displayValue}]}' t.json | cut -c1-2500
